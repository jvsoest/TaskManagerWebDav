name: Publish Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            command: npm run desktop:dist:mac
            artifact: taskmanager-macos
          - name: Windows x64
            os: windows-2022
            command: npm run desktop:dist:win
            artifact: taskmanager-windows
          - name: Linux x64
            os: ubuntu-22.04
            command: npm run desktop:dist:linux
            artifact: taskmanager-linux

    runs-on: ${{ matrix.os }}
    env:
      # Do not let electron-builder accidentally select an unrelated certificate
      # installed on a GitHub-hosted runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      MAC_SIGNING_ENABLED: ${{ secrets.MAC_CSC_LINK != '' }}
      WINDOWS_SIGNING_ENABLED: ${{ secrets.WIN_CSC_LINK != '' || secrets.CSC_LINK != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS signature
        if: runner.os == 'macOS' && env.MAC_SIGNING_ENABLED == 'true'
        run: |
          APP_PATH=$(find desktop-dist -maxdepth 3 -type d -name '*.app' -print -quit)
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}
        env:
          # A trusted Authenticode PFX is required to show a verified publisher.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK || secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}

      - name: Verify Windows signature
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $installers = Get-ChildItem desktop-dist -Filter *.exe
          if (-not $installers) { throw 'No Windows executables were produced' }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($installer.Name) does not have a valid Authenticode signature: $($signature.Status)"
            }
          }

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop-dist/*.dmg
            desktop-dist/*.exe
            desktop-dist/*.AppImage
            desktop-dist/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: taskmanager-*
          path: artifacts
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
            artifacts/*.deb
