name: Build iOS App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iOS app
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: npm ci

      - name: Build and sync iOS project
        run: npm run ios:sync

      - name: Compile iOS app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package compiled app
        run: ditto -c -k --sequesterRsrc --keepParent ios/DerivedData/Build/Products/Debug-iphoneos/App.app TaskManagerWebDav-iOS-unsigned.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: taskmanager-ios-unsigned
          path: TaskManagerWebDav-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
